<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-label="まがり">
  <!-- 「間」= 門の中の日。日をガムテープに置き換えて「間借り」。 -->
  <defs>
    <linearGradient id="tape" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d49a5a"/>
      <stop offset="0.5" stop-color="#c4874a"/>
      <stop offset="1" stop-color="#b87a3f"/>
    </linearGradient>
    <pattern id="weave" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="none"/>
      <path d="M0 3h6" stroke="#000" stroke-opacity="0.10" stroke-width="1"/>
      <path d="M3 0v6" stroke="#fff" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- アスファルトのタイル -->
  <rect width="512" height="512" rx="112" fill="#151617"/>

  <!-- 門（左右の柱と、内側に向く短い庇） -->
  <g fill="#f1efe9">
    <rect x="104" y="92" width="54" height="332" rx="10"/>
    <rect x="104" y="92" width="118" height="48" rx="10"/>
    <rect x="354" y="92" width="54" height="332" rx="10"/>
    <rect x="290" y="92" width="118" height="48" rx="10"/>
  </g>

  <!-- ガムテープ（日の位置に斜めに貼る） -->
  <g transform="rotate(-8 256 270)" filter="url(#shadow)">
    <polygon points="96,232 416,226 422,238 414,256 421,276 413,296 420,312 96,318 90,300 98,282 90,262 97,246"
             fill="url(#tape)"/>
    <polygon points="96,232 416,226 422,238 414,256 421,276 413,296 420,312 96,318 90,300 98,282 90,262 97,246"
             fill="url(#weave)"/>
    <!-- 光の反射 -->
    <polygon points="96,232 416,226 418,244 98,250" fill="#fff" fill-opacity="0.12"/>
  </g>
</svg>
